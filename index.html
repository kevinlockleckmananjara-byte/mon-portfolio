<!DOCTYPE html>
<html>
<head>
    <title>Mon Portfolio Freelance</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { color: #2c3e50; }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Salama Madagascar !</h1>
        <p>Je suis Kevin, développeur web junior à Madagascar.</p>
        <p>Je crée des sites internet modernes pour booster votre business.</p>
        <a href="#" class="btn">Engagez-moi</a>
    </div>

</body>
</html>
